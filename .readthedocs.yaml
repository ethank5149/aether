version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
        - docs
        - viz
        - atmosphere
        - certification
        - cfd
  system_packages: true

sphinx:
  configuration: docs/conf.py

build:
  image: latest